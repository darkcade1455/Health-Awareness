<!DOCTYPE html>
<html>
<head>
  <title>Contact Us</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #eaf3f8;
      padding: 20px;
    }
    body {
  font-size: 16px;
}

/* Smaller screens (phones) */
@media (max-width: 600px) {
  body {
    font-size: 14px;
  }
}


    h1 {
      text-align: center;
      color: #2c3e50;
    }

    .form-container {
      max-width: 600px;
      margin: auto;
      background-color: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
      transition: 0.3s;
    }

    input:hover, textarea:hover {
      border-color: #3498db;
      background-color: #f0faff;
    }

    button {
      margin-top: 20px;
      background-color: #3498db;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: 0.3s;
    }
      nav {
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px 20px;
      text-align: center;
    }

    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }


    button:hover {
      background-color: #2980b9;
      transform: scale(1.03);
    }
  </style>
</head>
<body onload="showPopup()">
   <div class="center-text">
    <h1>Welcome to HealthFirst <br><br>
 
    <nav>
        <a href="Health first .. project 1.html">Home</a>
       <a href="tips.html">Tips </a>
       <a href="contact.html">Emergency Contact</a>   
      </nav>

  <h1>Contact Us</h1>
   <div class="form-container">
    <form>
      <label for="name">Your Name:</label>
      <input type="text" id="name" placeholder="Enter your name" required>

      <label for="email">Email Address:</label>
      <input type="email" id="email" placeholder="Enter your email" required>

      <label for="message">Message:</label>
      <textarea id="message" rows="5" placeholder="Ask your health-related question or give feedback..." required></textarea>

      <button type="submit">Send Message</button>
    </form>
  </div>



</body>
</html>
